apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: care-connect-report-egress
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [networkpolicies]
  variables:
    - name: dns
      expression: object.metadata.name == 'allow-dns'
    - name: model
      expression: object.metadata.name.matches('^allow-agent-runtime-[0-9a-f]{12}$')
  validations:
    - expression: >-
        !has(object.spec.egress) || object.spec.egress.all(r,
          (variables.dns || variables.model) && has(r.to) && r.to.size() == 1 &&
          r.to.all(p, !has(p.ipBlock) && has(p.namespaceSelector) && has(p.podSelector) &&
            has(p.namespaceSelector.matchLabels) && has(p.podSelector.matchLabels) &&
            p.namespaceSelector.matchLabels == (variables.dns ?
              {'kubernetes.io/metadata.name': 'kube-system'} :
              {'kubernetes.io/metadata.name': 'care-connect'}) &&
            p.podSelector.matchLabels == (variables.dns ?
              {'k8s-app': 'kube-dns'} : {'app.kubernetes.io/name': 'care-connect-relay'})) &&
          has(r.ports) && r.ports.size() > 0 && r.ports.all(p,
            has(p.port) && !has(p.endPort) && has(p.protocol) &&
            (variables.dns ? (p.protocol in ['TCP', 'UDP'] && p.port in [53, 5353]) :
              (p.protocol == 'TCP' && p.port == 8443))))
      message: Care Connect permits only the private model relay and the selected cluster DNS service.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: care-connect-report-egress
spec:
  policyName: care-connect-report-egress
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        care.starkien.com/report-runtime: "true"
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: care-connect-report-egress
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [networkpolicies]
  matchConditions:
    - name: model-egress
      expression: >-
        object.metadata.name.matches('^allow-agent-runtime-[0-9a-f]{12}$') &&
        has(object.spec.egress) && object.spec.egress.size() > 0
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op:'replace',path:'/spec/egress',value:[
            Object.spec.egress{
              to:[Object.spec.egress.to{
                namespaceSelector:Object.spec.egress.to.namespaceSelector{matchLabels:{'kubernetes.io/metadata.name':'care-connect'}},
                podSelector:Object.spec.egress.to.podSelector{matchLabels:{'app.kubernetes.io/name':'care-connect-relay'}}
              }],
              ports:[Object.spec.egress.ports{protocol:'TCP',port:8443}]
            }
          ]}]
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: care-connect-report-egress
spec:
  policyName: care-connect-report-egress
  matchResources:
    namespaceSelector:
      matchLabels:
        care.starkien.com/report-runtime: "true"
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: care-connect-report-trust
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: embedded-gateway
      expression: >-
        has(object.metadata.labels) && 'openclaw.dev/workload-role' in object.metadata.labels &&
        object.metadata.labels['openclaw.dev/workload-role'] == 'gateway' &&
        has(object.spec.volumes) && object.spec.volumes.exists(v, v.name == 'openclaw-service-principal') &&
        object.spec.containers.exists(c, c.name == 'gateway')
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec:Object.spec{
            volumes:[Object.spec.volumes{name:'care-connect-report-trust',
              configMap:Object.spec.volumes.configMap{name:'care-connect-report-trust'}}],
            containers:[Object.spec.containers{name:'gateway',
              volumeMounts:[Object.spec.containers.volumeMounts{
                name:'care-connect-report-trust',mountPath:'/var/run/secrets/care-connect',readOnly:true}]}]
          }}
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: care-connect-report-trust
spec:
  policyName: care-connect-report-trust
  matchResources:
    namespaceSelector:
      matchLabels:
        care.starkien.com/report-runtime: "true"
